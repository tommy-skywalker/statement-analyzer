<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Statement Analyzer</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090a;color:#c9d1d9;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:center;padding:24px}
  .box{max-width:520px;border:1px solid #222a2f;background:#0d1011;padding:40px 32px;border-radius:4px}
  .code{color:#4ade80;font-size:13px;letter-spacing:.18em;font-weight:700}
  h1{font-size:28px;margin:14px 0 10px;text-transform:uppercase}
  p{color:#6a747d;font-size:14.5px;line-height:1.6;margin:0 0 24px}
  a{display:inline-block;margin:0 5px 8px;padding:12px 20px;border-radius:4px;font-weight:700;font-size:13px;
    text-transform:uppercase;letter-spacing:.05em;text-decoration:none;border:1px solid #222a2f;color:#c9d1d9}
  a.go{background:#4ade80;color:#06210f;border-color:#4ade80}
</style>
</head>
<body>
  <div class="box">
    <div class="code">ERROR 404</div>
    <h1>Page not found</h1>
    <p>That address doesn't exist. Head back to the home page, or open the analyzer and upload a statement.</p>
    <a class="go" href="/app">Open the analyzer</a>
    <a href="/">Home</a>
  </div>
</body>
</html>
