[package]
name = "statement-analyzer"
version = "1.0.0"
edition = "2021"
description = "Fast, deterministic bank-statement analysis engine (Rust)"
license = "MIT"

[[bin]]
name = "statement-analyzer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "limit", "compression-gzip", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
csv = "1.3"
calamine = { version = "0.26", features = ["dates"] }
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
